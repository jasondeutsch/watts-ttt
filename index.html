<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Tic-Tac-Toe</h1>
  <div id="status">Loading...</div>
  <div id="mode-display">Mode: Two players</div>
  <div class="mode-selector" id="mode-selector" role="radiogroup" aria-label="Game mode">
    <label class="mode-option">
      <input type="radio" name="mode" value="two-player" checked>
      <span>Two players</span>
    </label>
    <label class="mode-option">
      <input type="radio" name="mode" value="computer">
      <span>Computer</span>
    </label>
  </div>
  <div class="board" id="board">
    <button class="cell" data-index="0"></button>
    <button class="cell" data-index="1"></button>
    <button class="cell" data-index="2"></button>
    <button class="cell" data-index="3"></button>
    <button class="cell" data-index="4"></button>
    <button class="cell" data-index="5"></button>
    <button class="cell" data-index="6"></button>
    <button class="cell" data-index="7"></button>
    <button class="cell" data-index="8"></button>
  </div>
  <button id="reset-btn">Reset Game</button>
</div>
<script>
  const API_BASE = '';
  const cells = document.querySelectorAll('.cell');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('reset-btn');
  const modeRadios = document.querySelectorAll('input[name="mode"]');
  const modeDisplayEl = document.getElementById('mode-display');
  let currentGameOver = false;
  let currentMode = 'two-player';
  let moveInFlight = false;

  async function fetchState() {
    try {
      const res = await fetch(API_BASE + '/state');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const state = await res.json();
      renderBoard(state);
    } catch (err) {
      statusEl.textContent = 'Failed to load game state.';
      statusEl.className = 'error';
    }
  }

  function renderBoard(state) {
    for (let i = 0; i < 9; i++) {
      const cell = cells[i];
      const row = Math.floor(i / 3);
      const col = i % 3;
      const mark = (state.board[row][col]).trim();
      cell.textContent = mark || '';
      cell.className = 'cell';
      if (mark) {
        cell.classList.add('taken');
        cell.classList.add(mark === 'X' ? 'x' : 'o');
      }
      if (state.gameOver) cell.classList.add('game-over');
    }

    currentGameOver = state.gameOver;

    // Sync the mode readout and selector with the server's active mode, so a
    // page refresh restores the selected mode from GET /state (AC-7).
    const activeMode = (state.mode === 'computer') ? 'computer' : 'two-player';
    currentMode = activeMode;
    modeDisplayEl.textContent = activeMode === 'computer' ? 'Mode: Computer' : 'Mode: Two players';
    modeRadios.forEach(function(radio) {
      const selected = (radio.value === activeMode);
      radio.checked = selected;
      const label = radio.closest('label');
      if (label) label.classList.toggle('selected', selected);
    });

    if (state.winner) {
      statusEl.textContent = 'Player ' + state.winner + ' wins!';
      statusEl.className = 'win';
    } else if (state.gameOver) {
      statusEl.textContent = 'The game is a draw.';
      statusEl.className = 'draw';
    } else {
      statusEl.textContent = "Player " + state.currentPlayer + "'s turn";
      statusEl.className = '';
    }
  }

  async function makeMove(index) {
    if (currentGameOver || moveInFlight) return;
    moveInFlight = true;
    try {
      const res = await fetch(API_BASE + '/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cell: index })
      });
      const state = await res.json();
      renderBoard(state);
      if (!res.ok) {
        if (state.error) {
          statusEl.textContent = state.error;
        } else {
          statusEl.textContent = 'Invalid move';
        }
        statusEl.className = 'error';
      }
    } catch (err) {
      statusEl.textContent = 'Network error.';
      statusEl.className = 'error';
    } finally {
      moveInFlight = false;
    }
  }

  async function setMode(mode) {
    if (moveInFlight) return;
    if (mode === currentMode) return; // selecting the active mode: no effect
    try {
      const res = await fetch(API_BASE + '/mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: mode })
      });
      const state = await res.json();
      renderBoard(state);
      if (!res.ok && state.error) {
        statusEl.textContent = state.error;
        statusEl.className = 'error';
      }
    } catch (err) {
      statusEl.textContent = 'Failed to change game mode.';
      statusEl.className = 'error';
    }
  }

  async function resetGame() {
    try {
      const res = await fetch(API_BASE + '/reset', { method: 'POST' });
      const state = await res.json();
      renderBoard(state);
    } catch (err) {
      statusEl.textContent = 'Failed to reset game.';
      statusEl.className = 'error';
    }
  }

  cells.forEach(function(cell) {
    cell.addEventListener('click', function() {
      var index = parseInt(cell.dataset.index);
      makeMove(index);
    });
  });

  modeRadios.forEach(function(radio) {
    radio.addEventListener('change', function() {
      setMode(radio.value);
    });
  });

  resetBtn.addEventListener('click', resetGame);

  // Load initial state
  fetchState();
</script>
</body>
</html>
